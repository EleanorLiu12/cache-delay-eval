[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cache-delay-eval"
version = "0.1.0"
description = "Measure cache-aware routing failure cases on replayed LLM serving traces"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kejun Liu"}]
dependencies = []

[project.optional-dependencies]
live = ["aiohttp>=3.10,<4"]
plots = ["matplotlib>=3.8,<4"]
routing = ["pyzmq>=25", "msgspec>=0.18"]

[project.scripts]
cache-delay-generate-sessions = "cache_delay_eval.session_gen:main"
cache-delay-screen-patterns = "cache_delay_eval.pattern_screen:main"
cache-delay-validate-trace = "cache_delay_eval.trace:main"
cache-delay-pattern-pilot = "cache_delay_eval.paired_pilot:main"
cache-delay-analyze-patterns = "cache_delay_eval.analyze_patterns:main"
cache-delay-route = "cache_delay_eval.routing:main"

[tool.setuptools.packages.find]
where = ["src"]
